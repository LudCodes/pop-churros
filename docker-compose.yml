version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: popchurros
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/popchurros
      JWT_SECRET: pop-churros-super-secret
    ports:
      - '3000:3000'
    depends_on:
      - db
    volumes:
      - .:/app
volumes:
  postgres_data:
